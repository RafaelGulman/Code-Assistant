<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{if .IsEdit}}Редактирование{{else}}Новая задача{{end}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-form {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #333;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            border-color: #fff;
        }
        label, .form-label, .card-header { color: #fff !important; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .btn-glass {
            background: rgba(255, 255, 255, 0.4);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }
        .btn-glass:hover { background: rgba(255, 255, 255, 0.7); color: #333; }
        .btn-success { background: rgba(25, 135, 84, 0.8); border: none; color: white; }
        .btn-success:hover { background: rgba(25, 135, 84, 1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
    <div class="glass-form p-4 shadow-lg" style="max-width: 600px; width: 100%;">
        <div class="card-header bg-transparent border-0 mb-3 text-center">
            <h3>{{if .IsEdit}}✏️ Редактирование задачи #{{.Task.ID}}{{else}}➕ Новая задача{{end}}</h3>
        </div>
        <div class="card-body p-0">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Заголовок *</label>
                    <input type="text" name="title" class="form-control" 
                           value="{{if .IsEdit}}{{.Task.Title}}{{end}}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Описание (Промпт для ИИ)</label>
                    <textarea name="description" class="form-control" rows="4">{{if .IsEdit}}{{.Task.Description}}{{end}}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Приоритет</label>
                    <select name="priority" class="form-select">
                        <option value="0" {{if and .IsEdit (eq .Task.Priority 0)}}selected{{end}}>🟢 Низкий</option>
                        <option value="1" {{if or (not .IsEdit) (and .IsEdit (eq .Task.Priority 1))}}selected{{end}}>🟡 Средний</option>
                        <option value="2" {{if and .IsEdit (eq .Task.Priority 2)}}selected{{end}}>🔴 Высокий</option>
                    </select>
                </div>

                {{if .IsEdit}}
                <div class="mb-3">
                    <label class="form-label">Статус</label>
                    <select name="status" class="form-select">
                        <option value="0" {{if eq .Task.Status 0}}selected{{end}}>⏹️ Остановлено</option>
                        <option value="1" {{if eq .Task.Status 1}}selected{{end}}>▶️ В процессе</option>
                        <option value="2" {{if eq .Task.Status 2}}selected{{end}}>✅ Завершено</option>
                        <option value="-1" {{if eq .Task.Status -1}}selected{{end}}>❌ Ошибка</option>
                    </select>
                </div>

                {{if .Task.BeginTask.Unix}}
                <div class="mb-2 small opacity-75">
                    <strong>Начало:</strong> {{.Task.BeginTask.Format "02.01.2006 15:04"}}
                </div>
                {{end}}
                {{if .Task.EndTask.Unix}}
                <div class="mb-3 small opacity-75">
                    <strong>Завершение:</strong> {{.Task.EndTask.Format "02.01.2006 15:04"}}
                </div>
                {{end}}
                {{end}}

                <div class="d-flex gap-2 justify-content-center mt-4">
                    <button type="submit" class="btn btn-success px-4 py-2">💾 Сохранить</button>
                    <a href="/" class="btn btn-glass px-4 py-2">↩️ Назад</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
